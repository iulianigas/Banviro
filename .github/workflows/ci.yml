name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: banviro
          POSTGRES_PASSWORD: banviro
          POSTGRES_DB: banviro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U banviro -d banviro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install fastmcp==3.4.2
          pip install 'starlette==0.46.2' 'uvicorn[standard]==0.34.2' 'python-multipart==0.0.20'

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://banviro:banviro@localhost:5432/banviro
          SECRET_KEY: ci-secret-key
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql://banviro:banviro@localhost:5432/banviro
          SECRET_KEY: ci-secret-key
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  # Deploy placeholder — configure secrets and target platform in phase 2
  deploy:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy placeholder
        run: |
          echo "CI passed. Add deploy steps here (Railway, Fly.io, Vercel, etc.)."
