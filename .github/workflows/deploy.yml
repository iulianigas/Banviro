name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
      actions: read

    env:
      REGISTRY: ghcr.io
      BACKEND_IMAGE: ghcr.io/${{ github.repository }}/banviro-api
      DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ env.DEPLOY_SHA }}

      - name: Deploy frontend to Vercel
        if: vars.ENABLE_VERCEL_DEPLOY == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: --prod

      - name: Redeploy backend on Railway
        if: vars.ENABLE_RAILWAY_DEPLOY == 'true'
        run: |
          npm install -g @railway/cli
          railway redeploy \
            --service "${{ vars.RAILWAY_SERVICE_NAME || 'banviro-api' }}" \
            --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deployment summary
        run: |
          {
            echo "## Production deployment"
            echo "- Backend image: \`${{ env.BACKEND_IMAGE }}:latest\`"
            echo "- Image tag: \`${{ env.DEPLOY_SHA }}\`"
            echo "- Commit: \`${{ env.DEPLOY_SHA }}\`"
            if [ "${{ vars.ENABLE_VERCEL_DEPLOY }}" = "true" ]; then
              echo "- Frontend: Vercel production"
            else
              echo "- Frontend: skipped (set repo variable ENABLE_VERCEL_DEPLOY=true)"
            fi
            if [ "${{ vars.ENABLE_RAILWAY_DEPLOY }}" = "true" ]; then
              echo "- Backend: Railway redeploy triggered"
            else
              echo "- Backend runtime: pull GHCR image or set ENABLE_RAILWAY_DEPLOY=true"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
